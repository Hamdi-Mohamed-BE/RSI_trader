[project]
name = "asia-breakout"
version = "0.1.0"
description = "MT5 Asian-session breakout bot and cross-symbol backtester"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.5700",
  "numpy>=2.2",
  "pandas>=2.2",
  "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
asia-breakout = "asia_breakout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asia_breakout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

