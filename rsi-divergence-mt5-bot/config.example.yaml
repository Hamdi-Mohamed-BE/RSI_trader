mt5:
  mode: native_windows
  path: C:/Program Files/MetaTrader 5/terminal64.exe
  login: null
  password: null
  server: null
  host: localhost
  port: 18812
  transport: tcp
  timeout: 300
  broker_symbol_suffix: "-VIP"
  # Or use the legacy env-style key name:
  # RSI_BOT_BROKER_SYMBOL_SUFFIX: "-STD"
bot:
  dry_run: true
  auto_start: true
  poll_seconds: 15
  magic: 260521
  strategy: signal_with_tp_protection
  trade_decision_profile: balanced
  max_concurrent_setups: 3
  state_file: runtime/state.json
  log_file: runtime/bot.log
  ai_trade_review:
    enabled: false
    use_in_backtest: false
    min_confidence: 0.55
    strategies: []
    openai_api_key: null
    openai_model: null
    gemini_api_key: null
    gemini_model: null
risk:
  max_setup_risk_usd: 180.0
  default_forex_lot: 0.25
  # default_forex_lot is also editable in Settings UI; used for Telegram auto-registered forex pairs.
  use_daily_loss_guard: true
  max_daily_loss_pct: 15.0
  max_extension_atr: 1.8
  max_spread_atr: 0.35
  max_live_entry_drift_risk: 0.35
  min_tp1_spread_multiple: 1.5
  use_spread_filter: true
  use_tp1_spread_filter: true
  use_risk_filter: true
  use_existing_position_filter: false
  use_max_setups_filter: false
  skip_if_symbol_has_position: true
web:
  host: 0.0.0.0
  port: 8787
auth:
  username: admin
  password: admin
  cookie_name: rsi_bot_auth
telegram_signals:
  enabled: false
  poll_seconds: 5
  telegram_url: https://web.telegram.org/k/
  channels:
  - name: PROFIT HACKER
    url: https://web.telegram.org/k/#-1303328644
    enabled: true
  - name: Donnfx7 Community
    url: https://web.telegram.org/k/#@donnfx7community
    enabled: true
  - name: Telegram Signal Channel -2946712067
    url: https://web.telegram.org/k/#-2946712067
    enabled: true
  - name: FOREX USA MASTER
    url: https://web.telegram.org/k/#@FOREXUSAMASTER1
