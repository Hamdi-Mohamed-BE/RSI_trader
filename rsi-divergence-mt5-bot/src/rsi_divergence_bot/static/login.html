<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e14">
  <title>Login - RSI Divergence MT5 Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=22">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand login-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 18L8 10L12 14L16 6L20 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1>RSI Divergence MT5 Bot</h1>
          <p class="subtitle">Sign in to open the trading dashboard</p>
        </div>
      </div>

      <div id="login-error" class="login-error hidden">Wrong username or password.</div>

      <form class="form-grid login-form" method="post" action="/login">
        <input id="login-next" type="hidden" name="next" value="/">
        <label class="field field-full">
          <span>Username</span>
          <input name="username" autocomplete="username" value="admin" required autofocus>
        </label>
        <label class="field field-full">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" value="admin" required>
        </label>
        <div class="form-actions field-full">
          <button class="btn btn-primary login-button" type="submit">Login</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next");
    if (next && next.startsWith("/") && !next.startsWith("//")) {
      document.getElementById("login-next").value = next;
    }
    if (params.get("error")) {
      document.getElementById("login-error").classList.remove("hidden");
    }
  </script>
</body>
</html>
