services:
  mt5:
    build:
      context: .
      dockerfile: Dockerfile.mt5
    image: rsi-mt5-patched:latest
    container_name: rsi-mt5
    restart: unless-stopped
    privileged: true
    shm_size: "4gb"
    security_opt:
      - seccomp=unconfined
    environment:
      PUID: 1000
      PGID: 1000
      CUSTOM_USER: 1115548
      PASSWORD: o7%FfoVB
    volumes:
      - mt5_config:/config
    ports:
      - "6081:3000"
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1', 8001), 3); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s

  bot:
    build:
      context: .
    container_name: rsi-mt5-bot
    restart: unless-stopped
    depends_on:
      mt5:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./runtime:/app/runtime
    ports:
      - "8787:8787"

volumes:
  mt5_config:
