[project]
name = "telegram-mt5-copier"
version = "0.1.0"
description = "Telegram to MetaTrader 5 Signal Copier with FastAPI and Gemini AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.18",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "telethon>=1.30.0",
    "google-genai>=0.1.1",
    "MetaTrader5>=5.0.45",
    "tenacity>=8.2.2",
    "loguru>=0.7.0",
    "orjson>=3.9.0",
    "httpx>=0.24.0",
    "qrcode[pil]>=7.4.2",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
