[project]
name = "xau-orb-retest"
version = "0.1.0"
description = "Filtered multi-symbol opening-range breakout and retest bot for MetaTrader 5"
requires-python = ">=3.11,<3.14"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=2.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tzdata>=2025.2",
]

[project.scripts]
orb-backtest = "orb.backtest:main"
orb-live = "orb.live:main"
orb-london-backtest = "orb.london_midpoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb"]
