[project]
name = "lta-system"
version = "0.1.0"
description = "Auditable LTA-style market scanner, backtester, and MT5 forward runner"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.5700",
  "numpy>=2.2",
  "pandas>=2.2",
  "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
lta = "lta_system.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lta_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

