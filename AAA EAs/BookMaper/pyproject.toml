[project]
name = "bookmaper"
version = "0.1.0"
description = "Markov-regime research, active-EA validation, and future Databento-to-MT5 signal bridge."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "databento>=0.64.0",
  "matplotlib>=3.10.5",
  "numpy>=2.2.6",
  "pandas>=2.3.1",
  "python-dotenv>=1.1.1",
  "scipy>=1.16.1",
  "yfinance>=0.2.65",
]

[project.optional-dependencies]
live = ["MetaTrader5>=5.0.5120"]

[dependency-groups]
dev = ["pytest>=8.4.1"]

[project.scripts]
bookmaper = "bookmaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookmaper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

