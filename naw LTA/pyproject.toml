[project]
name = "naw-lta"
version = "0.1.0"
description = "Order-flow aware LTA scanner and backtesting dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "celery[sqlalchemy]>=5.5.3",
  "databento>=0.67.0",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "metatrader5>=5.0.5735",
  "numpy>=2.2.6",
  "orjson>=3.11.1",
  "pandas>=2.3.1",
  "pydantic-settings>=2.10.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naw_lta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
