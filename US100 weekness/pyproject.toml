[project]
name = "us100-session-bot"
version = "0.1.0"
description = "DST-aware US100 New York open strategies for MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.5700",
  "numpy>=2.2",
  "pandas>=2.2",
  "python-dotenv>=1.1",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
us100-bot = "us100_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/us100_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

