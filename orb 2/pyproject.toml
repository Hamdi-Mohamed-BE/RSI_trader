[project]
name = "orb-playbook-bot"
version = "0.1.0"
description = "Systematic implementation of the Mind Over Markets ORB Playbook"
requires-python = ">=3.11,<3.14"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=2.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
orb2-backtest = "orb2.optimizer:main"
orb2-live = "orb2.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb2"]
