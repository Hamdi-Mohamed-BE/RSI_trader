[project]
name = "amd-session-bot"
version = "0.1.0"
description = "Accumulation-Manipulation-Distribution session strategy for MT5"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.5700",
  "numpy>=2.2",
  "pandas>=2.2",
  "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
amd-bot = "amd_bot.cli:main"
amd-article-research = "amd_bot.article_research:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amd_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
