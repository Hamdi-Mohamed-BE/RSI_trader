[project]
name = "xau-weakness"
version = "0.1.0"
description = "XAUUSD bearish-impulse double-high breakout bot for MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.5700",
  "numpy>=2.0",
  "pandas>=2.2",
  "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
xau-weakness = "xau_weakness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xau_weakness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
