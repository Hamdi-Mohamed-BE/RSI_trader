[project]
name = "ema3-pivot-backtest"
version = "0.1.0"
description = "Look-ahead-safe MT5 backtest of the 3EMA + Bollinger + Pivot reversal logic."
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ema3-backtest = "ema3_backtest.backtest:main"
ema3-optimize = "ema3_backtest.optimize:main"
ema3-live = "ema3_backtest.live_bot:main"
ema3-compare-timeframes = "ema3_backtest.timeframe_compare:main"
ema3-risk-study = "ema3_backtest.risk_study:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ema3_backtest"]
