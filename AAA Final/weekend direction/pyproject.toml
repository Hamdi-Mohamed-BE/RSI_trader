[project]
name = "xau-weekend-direction"
version = "0.1.0"
description = "Validation-gated XAUUSD Friday weekend-direction worker"
requires-python = ">=3.12"
dependencies = [
  "MetaTrader5>=5.0.5700; platform_system == 'Windows'",
  "joblib>=1.4",
  "numpy>=2.0",
  "python-dotenv>=1.1",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
weekend-direction = "weekend_direction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weekend_direction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
