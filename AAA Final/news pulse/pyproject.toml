[project]
name = "xau-news-pulse"
version = "0.1.0"
description = "Broker-aware XAUUSD high-impact USD news pending-order worker"
requires-python = ">=3.12"
dependencies = [
  "MetaTrader5>=5.0.5700; platform_system == 'Windows'",
  "joblib>=1.4",
  "numpy>=2.0",
  "python-dotenv>=1.1",
  "requests>=2.32",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
news-pulse = "news_pulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
