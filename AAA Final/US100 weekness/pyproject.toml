[project]
name = "nasdaq-weakness"
version = "0.1.0"
description = "Research-first MT5 implementation of the New York Nasdaq weakness strategy."
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.5120",
    "numpy>=2.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
nasdaq-weakness = "nasdaq_weakness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasdaq_weakness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
