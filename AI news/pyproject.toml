[project]
name = "gold-news-impulse-ai"
version = "0.1.0"
description = "Prediction-only XAUUSD high-impact news impulse research service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "joblib>=1.4",
  "MetaTrader5>=5.0.45; platform_system == 'Windows'",
  "numpy>=2.0",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.20",
  "requests>=2.32",
  "scikit-learn==1.8.0",
  "uvicorn>=0.35",
]

[tool.uv]
package = false
